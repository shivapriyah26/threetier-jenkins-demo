<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Tier Contact Book Demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Contact Book (3-Tier Demo)</h1>
    <p class="subtitle">Presentation tier: static HTML/JS &rarr; Application tier: Express API &rarr; Data tier: MySQL</p>

    <form id="contact-form">
      <input type="text" id="name" placeholder="Name" required />
      <input type="email" id="email" placeholder="Email" required />
      <input type="text" id="phone" placeholder="Phone (optional)" />
      <button type="submit">Add Contact</button>
    </form>

    <ul id="contact-list"></ul>
  </div>
  <script src="script.js"></script>
</body>
</html>
